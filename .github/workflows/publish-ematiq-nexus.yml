# Publishes this fork's patched Iceberg jars to the Ematiq Nexus so that images
# consume them as ordinary versioned artifacts instead of compiling Iceberg.
#
# Why not build Iceberg inside the consuming Dockerfile (as k8s/kafka-connect
# does in data-infrastructure): the fork changes roughly twice a year while the
# images that use it are rebuilt far more often, and `git clone --branch <name>`
# follows a moving branch, so the same Dockerfile can produce different jars
# with nothing in the image tag recording which commit went in. A published
# version is an immutable coordinate.
#
# Two artifacts are published because BOTH contain org.apache.iceberg.aws.glue.
# GlueCatalog: spark/v4.1/build.gradle has `implementation project(':iceberg-aws')`
# inside the runtime block, and shadowJar relocates only third-party packages.
# Replacing just one of them leaves a patched and an unpatched GlueCatalog on the
# same classpath, and jar order decides which wins.
name: Publish ematiq Iceberg to Nexus

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.11.0-ematiq.1 — bump the suffix on every publish"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never cancel a run that is mid-publish

permissions:
  contents: read

env:
  NEXUS_REPO: https://nexus.ematiq.com/repository/maven-releases

jobs:
  publish:
    # Guard against this running in a fork of the fork, mirroring upstream's
    # `github.repository_owner == 'apache'` check on publish-snapshot.yml.
    if: github.repository_owner == 'EmatiqCom'
    runs-on:
      - ultra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Refuse to overwrite a published version
        # Nexus hosted release repos reject a redeploy anyway, but failing here
        # costs seconds instead of a full Iceberg build.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          case "$VERSION" in
            *-ematiq.*) ;;
            *) echo "::error::version must carry an -ematiq.N suffix, got '$VERSION'"; exit 1 ;;
          esac
          url="${NEXUS_REPO}/org/apache/iceberg/iceberg-aws-bundle/${VERSION}/iceberg-aws-bundle-${VERSION}.jar"
          if curl -fsI --max-time 20 "$url" >/dev/null 2>&1; then
            echo "::error::${VERSION} is already published. Bump the -ematiq.N suffix."
            exit 1
          fi

      - name: Pin the version
        # build.gradle's getProjectVersion() prefers version.txt over `git describe`,
        # so this is the project's own supported way to set a version.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          printf '%s\n' "$VERSION" > version.txt
          ./gradlew printVersion --no-daemon --console=plain

      - name: Publish
        env:
          NEXUS_USER: ${{ secrets.EMATIQ_PUBLISH_USERNAME }}
          NEXUS_PW: ${{ secrets.EMATIQ_PUBLISH_PASSWORD }}
        # deploy.gradle picks releasesRepoUrl only under -Prelease, which also turns
        # on GPG signing with the Apache release key we do not have. So the target
        # goes in through the snapshots slot, which is a plain URL override — the
        # version itself is what makes this a release, not the property name.
        run: |
          ./gradlew --no-daemon --console=plain \
            -DflinkVersions= -DkafkaVersions= -DsparkVersions=4.1 -DscalaVersion=2.13 \
            :iceberg-aws-bundle:publishApachePublicationToMavenRepository \
            :iceberg-spark:iceberg-spark-runtime-4.1_2.13:publishApachePublicationToMavenRepository \
            -PmavenSnapshotsRepo="${NEXUS_REPO}" \
            -PmavenUser="$NEXUS_USER" -PmavenPassword="$NEXUS_PW"

      - name: Summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Published \`${VERSION}\`"
            echo ""
            echo "- \`org.apache.iceberg:iceberg-aws-bundle:${VERSION}\`"
            echo "- \`org.apache.iceberg:iceberg-spark-runtime-4.1_2.13:${VERSION}\`"
            echo ""
            echo "To roll it out, set \`ARG ICEBERG_VERSION=${VERSION}\` in"
            echo "\`k8s/spark/Dockerfile\` (data-infrastructure) and run **Release spark & kyuubi images**"
            echo "with \`both\` — kyuubi inherits it from the spark-iceberg base."
          } >> "$GITHUB_STEP_SUMMARY"
